# Where each log lives. If a log moves to another index, change it here once
# (or in Settings > Advanced search > Search macros) and every alert and panel follows.

[windows_security]
definition = (index=* source="WinEventLog:Security")

[windows_system]
definition = (index=* source="WinEventLog:System")

[windows_sysmon]
definition = (index=* source="*Sysmon*")

[windows_powershell]
definition = (index=* source="*PowerShell/Operational")

[windows_defender]
definition = (index=* source="*Windows Defender*")

[windows_winrm]
definition = (index=* source="*WinRM*")

[linux_auth]
definition = (index=* (source="/var/log/auth.log" OR source="/var/log/secure"))

[linux_syslog]
definition = (index=* (source="/var/log/syslog" OR source="/var/log/messages" OR source="/var/log/cron"))

[web_access]
definition = (index=* sourcetype=access_combined)

[mail]
definition = (index=* (source="/var/log/mail.log" OR source="/var/log/maillog"))

[ftp]
definition = (index=* (source="*vsftpd.log" OR source="*xferlog"))

[paloalto_traffic]
definition = (index=* sourcetype="pan:traffic")

[paloalto_threat]
definition = (index=* sourcetype="pan:threat")

[paloalto_system]
definition = (index=* sourcetype="pan:system")

[paloalto_config]
definition = (index=* sourcetype="pan:config")

# VyOS sends syslog to UDP 5515 on the Splunk server (see examples/splunk_server_syslog_inputs.conf).
[vyos]
definition = (index=* source="udp:5515")

[splunk_audit]
definition = (index=_audit)

# Every host that should be sending logs, comma separated, exactly as the Health dashboard shows them. Used by the Host stopped sending logs alert. Replace CHANGE_ME, e.g. split("dc01,mssql01,ecomm,mail", ",").
[expected_hosts]
definition = makeresults | eval host=split("CHANGE_ME", ",") | mvexpand host | eval host=lower(trim(host)) | table host
