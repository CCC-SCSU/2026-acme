# Where each log lives. If you move logs to a different index (for example index=windows),
# change it here once and every search and dashboard panel in this app follows.

[windows_sysmon]
definition = (index=* source="*Sysmon*")

[windows_system]
definition = (index=* source="WinEventLog:System")

[windows_security]
definition = (index=* source="WinEventLog:Security")
