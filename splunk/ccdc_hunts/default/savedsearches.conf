# Each stanza is one detection. It runs every 5 minutes over a 5-minute window
# (lagged 1 minute so late-arriving logs are not missed). Any hit shows up under
# Activity > Triggered Alerts.

[likely smbexec service running cmd, bat, ps]
description = A new service whose command runs cmd, a .bat file or PowerShell. smbexec creates one of these for every command it runs. Source: System log 7045.
search = `windows_system` EventCode=7045 (Service_File_Name="*COMSPEC*" OR Service_File_Name="*cmd*" OR Service_File_Name="*.bat*" OR Service_File_Name="*powershell*") | table _time host Service_Name Service_File_Name Service_Account
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 6

[likely smbexec cmd started by services.exe]
description = cmd or PowerShell launched directly by services.exe. Real services start their own .exe, not a shell. Source: Sysmon 1.
search = `windows_sysmon` EventCode=1 ParentImage="*services.exe" Image IN ("*cmd.exe","*powershell.exe","*pwsh.exe") | table _time host User ParentImage Image CommandLine
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 6

[Shell under WMI, WinRM or Task Scheduler]
description = A shell or script host started by WMI (wmiexec), WinRM (evil-winrm, nxc winrm) or Task Scheduler (atexec). Check whether the scoring engine's WinRM check causes hits and note what normal looks like. Source: Sysmon 1.
search = `windows_sysmon` EventCode=1 (ParentImage="*WmiPrvSE.exe" OR ParentImage="*wsmprovhost.exe" OR ParentImage="*taskeng.exe" OR ParentCommandLine="*-s Schedule*") Image IN ("*cmd.exe","*powershell.exe","*pwsh.exe","*wscript.exe","*cscript.exe","*mshta.exe","*rundll32.exe") | table _time host User ParentImage Image CommandLine
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 5

[Batch file written to Windows Temp]
description = A .bat file created in C:\Windows\Temp. smbexec writes one per command and deletes it. Only works if your Sysmon config logs .bat file creation. Source: Sysmon 11.
search = `windows_sysmon` EventCode=11 TargetFilename="*Windows*Temp*.bat" | table _time host User Image TargetFilename
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 6
