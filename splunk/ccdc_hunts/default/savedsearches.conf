description = A host on the expected_hosts list sent nothing for 10 minutes. Dashboard: Health & Splunk. Playbook page 18: /en-US/static/app/ccdc_hunts/playbook.pdf#page=18&nameddest=host-stopped-sending-logs
search = | `expected_hosts` | join type=left host [| tstats max(_time) as last where index=* by host | eval host=lower(host)] | eval minutes_quiet=if(isnull(last), "never seen", round((now()-last)/60)) | where isnull(last) OR last < relative_time(now(), "-10m") | table host minutes_quiet
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0-59/5 * * * *
schedule_window = auto
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 5
request.ui_dispatch_app = ccdc_hunts
request.ui_dispatch_view = search
alert.suppress = 1
alert.suppress.period = 30m

[Splunk login failures]
description = Someone failed to log into Splunk. Dashboard: Health & Splunk. Playbook page 18: /en-US/static/app/ccdc_hunts/playbook.pdf#page=18&nameddest=splunk-login-failures
search = `splunk_audit` action="login attempt" info=failed | stats count latest(_time) as last by user src | convert ctime(last) | sort - count
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = 1-59/5 * * * *
schedule_window = auto
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 4
request.ui_dispatch_app = ccdc_hunts
request.ui_dispatch_view = search
