# One stanza per alert. Hits show up under Activity > Triggered Alerts.
# Each description links to the matching section of the response playbook.

[smbexec service runs cmd]
description = A new service runs cmd, a .bat file or PowerShell. smbexec makes one per command. Dashboard: Remote Execution. Playbook page 4: /en-US/static/app/ccdc_hunts/playbook.pdf#page=4&nameddest=smbexec-service-runs-cmd
search = `windows_system` EventCode=7045 (Service_File_Name="*COMSPEC*" OR Service_File_Name="*cmd*" OR Service_File_Name="*.bat*" OR Service_File_Name="*powershell*") | table _time host Service_Name Service_File_Name Service_Account
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = 0-59/5 * * * *
schedule_window = auto
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 6
request.ui_dispatch_app = ccdc_hunts
request.ui_dispatch_view = search

[smbexec cmd started by services.exe]
description = cmd or PowerShell started directly by services.exe: smbexec's service actually running. Dashboard: Remote Execution. Playbook page 5: /en-US/static/app/ccdc_hunts/playbook.pdf#page=5&nameddest=smbexec-cmd-started-by-servicesexe
search = `windows_sysmon` EventCode=1 ParentImage="*services.exe" Image IN ("*cmd.exe","*powershell.exe","*pwsh.exe") | table _time host User ParentImage Image CommandLine
dispatch.earliest_time = -6m@m
dispatch.latest_time = -1m@m
cron_schedule = 1-59/5 * * * *
schedule_window = auto
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 5
request.ui_dispatch_app = ccdc_hunts
request.ui_dispatch_view = search

[Shell under WMI, WinRM or Task Scheduler]
