# Linux universal forwarder (Rocky ecomm, Ubuntu mail, Ubuntu workstation)
# Put in: /opt/splunkforwarder/etc/apps/ccdc_inputs/local/inputs.conf  then: sudo systemctl restart SplunkForwarder
# On the Debian Splunk server itself, put the same file in /opt/splunk/etc/apps/ccdc_inputs/local/inputs.conf
#
# Files that don't exist on a box are simply skipped, so the same file works everywhere.
#
# PERMISSIONS: newer forwarders run as the user "splunkfwd", which can't read most of /var/log.
#   Ubuntu/Debian:  sudo usermod -aG adm splunkfwd      (Splunk server: sudo usermod -aG adm splunk)
#   Rocky:          /var/log/secure, messages, cron and audit/ are root-only. Simplest fix in a competition:
#                   run the forwarder as root:
#                     sudo systemctl stop SplunkForwarder
#                     sudo /opt/splunkforwarder/bin/splunk disable boot-start
#                     sudo /opt/splunkforwarder/bin/splunk enable boot-start -user root -systemd-managed 1
#                     sudo systemctl start SplunkForwarder
# Check it worked: sudo /opt/splunkforwarder/bin/splunk list monitor

# Logins, sudo, user changes  (macro: linux_auth)
[monitor:///var/log/auth.log]
sourcetype = linux_secure
[monitor:///var/log/secure]
sourcetype = linux_secure

# System messages, service stops, cron  (macro: linux_syslog)
[monitor:///var/log/syslog]
sourcetype = syslog
[monitor:///var/log/messages]
sourcetype = syslog
[monitor:///var/log/cron]
sourcetype = syslog

[monitor:///var/log/audit/audit.log]
sourcetype = linux_audit

# Web server  (macro: web_access needs sourcetype access_combined)
[monitor:///var/log/httpd/access_log]
sourcetype = access_combined
[monitor:///var/log/httpd/ssl_access_log]
sourcetype = access_combined
[monitor:///var/log/apache2/access.log]
sourcetype = access_combined
[monitor:///var/log/nginx/access.log]
sourcetype = access_combined
[monitor:///var/log/httpd/error_log]
sourcetype = apache_error
[monitor:///var/log/apache2/error.log]
sourcetype = apache_error
[monitor:///var/log/nginx/error.log]
sourcetype = nginx_error

# Mail: Postfix and Dovecot  (macro: mail)
[monitor:///var/log/mail.log]
sourcetype = postfix_syslog
[monitor:///var/log/maillog]
sourcetype = postfix_syslog

# FTP  (macro: ftp)
[monitor:///var/log/vsftpd.log]
sourcetype = vsftpd
[monitor:///var/log/xferlog]
sourcetype = vsftpd
