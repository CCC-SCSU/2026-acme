# On the Splunk server: receive syslog from the Palo Alto and the VyOS router.
# Put in: /opt/splunk/etc/apps/ccdc_inputs/local/inputs.conf  then: sudo systemctl restart Splunkd
# Open the ports on the Splunk box's firewall (ufw: sudo ufw allow 5514/udp; sudo ufw allow 5515/udp),
# and allow them from the firewall/router to the Splunk box. Never from the WAN.
# Install the "Palo Alto Networks Add-on for Splunk" on the Splunk server so pan:log is split into
# pan:traffic, pan:threat, pan:system and pan:config (the paloalto_* macros).
# Some add-on versions expect sourcetype = pan:firewall instead of pan:log. Use whichever the add-on's
# setup page names; if pan:traffic never appears in Splunk, try the other one.

# Palo Alto: Device > Server Profiles > Syslog -> this server, UDP 5514, BSD format.
# Then attach a Log Forwarding profile (traffic + threat) to your security rules, and forward
# System and Config logs under Device > Log Settings.
[udp://5514]
sourcetype = pan:log
connection_host = ip

# VyOS: point remote syslog at this server on UDP port 5515 (macro: vyos)
[udp://5515]
sourcetype = syslog
connection_host = ip
